<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Works · Lee Chaeyun">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#ffffff">
  <title>Works · Lee Chaeyun</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./src/gallery.css">
  <script type="module" src="./src/public.js"></script>
</head>
<body class="content-page" data-view="works">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="header">
    <a href="index.html" class="logo" data-english>Lee Chaeyun</a>
    <a href="works.html" data-page="works">Works</a>
    <a href="news.html" data-page="news">Exhibition</a>
    <a href="texts.html" data-page="texts">Texts</a>
    <a href="cv.html" data-page="cv">CV</a>
  </header>
  <main id="main" class="page works-page">
    <div class="works-toolbar">
      <h1 id="works-heading"><button id="works-menu-toggle" type="button" aria-expanded="false" aria-controls="works-menu">Works</button></h1>
      <nav id="works-menu" class="works-shortcuts" aria-label="작품 분류 및 연도" hidden>
        <div id="works-year-links" class="works-year-links" aria-label="연도별 바로가기"></div>
        <a href="#works-drawings">Drawings</a>
      </nav>
    </div>
    <div class="works-content">
      <div id="works-grid" class="works-years" aria-live="polite"><p class="empty-state">작품을 불러오고 있습니다.</p></div>
      <p id="load-error" class="error" role="alert" hidden></p>
    </div>
  </main>
  <dialog id="lightbox" aria-labelledby="lightbox-title">
    <button class="lightbox-close" aria-label="작품 확대 닫기">Close ×</button>
    <div class="work-image-stage">
      <button class="lightbox-image image-viewer-trigger" type="button" aria-label="작품 이미지 확대"></button>
      <button id="previous-work" class="work-nav work-nav-previous" aria-label="이전 작품">&lt;</button>
      <button id="next-work" class="work-nav work-nav-next" aria-label="다음 작품">&gt;</button>
    </div>
    <div class="lightbox-bottom">
      <div><h2 id="lightbox-title"></h2><p id="lightbox-meta"></p></div>
    </div>
  </dialog>
  <footer class="page-footer"><small>© <span id="copyright-year"></span> <span data-english>Lee Chaeyun</span></small><a href="./admin/">Admin</a></footer>
</body>
</html>
