name: Deploy Cloudflare Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/content/**'
      - 'public/uploads/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          ADMIN_API_URL: https://chaeyun-admin.chaeyun-homepage.workers.dev
      - name: Deploy
        run: npx --no-install wrangler pages deploy dist --project-name leechaeyun --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cbeb9b23377a844fe2f23076a3950ccf
