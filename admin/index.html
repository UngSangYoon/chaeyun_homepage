<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Admin · Lee Chaeyun</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../src/gallery.css">
  <link rel="stylesheet" href="../src/admin.css">
  <script type="module" src="../src/admin.js"></script>
</head>
<body class="content-page admin-body">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <main id="main" class="page reading-page admin-main">
    <section id="login-panel" class="login-panel" aria-labelledby="login-title">
      <div class="page-heading"><h1 id="login-title">Admin</h1></div>
      <p class="muted">작품과 글을 관리하려면 로그인해 주세요.</p>
      <form id="login-form">
        <label for="password">관리자 비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required maxlength="256" aria-describedby="login-error">
        <button class="primary" type="submit">로그인 →</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
      <p id="setup-notice" class="notice" hidden>관리자 연결을 준비하고 있습니다. 저장소의 배포 안내에 따라 관리자 API 주소를 설정해 주세요.</p>
      <a class="text-link" href="../index.html">홈페이지 보기 ↗</a>
    </section>
    <section id="editor" aria-labelledby="editor-title" hidden>
      <div class="page-heading admin-heading">
        <div><h1 id="editor-title">Admin</h1><p class="muted">홈페이지 메뉴와 같은 순서로 작품, 전시, 글, 작가 소개와 약력을 관리합니다.</p></div>
        <button id="logout" class="secondary">로그아웃</button>
      </div>
      <div class="editor-toolbar">
        <nav aria-label="관리 항목">
          <button type="button" data-tab="works" aria-current="page">Works</button>
          <button type="button" data-tab="exhibitions">Exhibition</button>
          <button type="button" data-tab="texts">Texts</button>
          <button type="button" data-tab="cv">CV</button>
        </nav>
        <div class="save-actions"><span id="dirty-label">저장됨</span><button id="save" class="primary">변경사항 게시</button></div>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="editor-content"></div>
    </section>
  </main>
  <footer class="page-footer"><small>Lee Chaeyun</small><a href="../index.html">홈페이지 보기 ↗</a></footer>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <h2 id="confirm-title">항목을 삭제할까요?</h2>
    <p id="confirm-description">게시하면 홈페이지에서도 삭제됩니다.</p>
    <div><button id="cancel-delete" class="secondary">취소</button><button id="confirm-delete" class="danger">삭제</button></div>
  </dialog>
</body>
</html>
